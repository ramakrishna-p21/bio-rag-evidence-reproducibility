[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biorag-repro"
version = "0.1.0"
description = "Reproducibility foundations for bioinformatics evidence retrieval research"
authors = [{ name = "Rama Krishna Pudota" }]
requires-python = ">=3.11,<3.12"
dependencies = ["pydantic>=2,<3", "rfc8785>=0.1,<1"]

[project.scripts]
biorag-context = "biorag_repro.retrieval.cli:main"
biorag-analysis = "biorag_repro.evaluation.analysis_cli:main"

[project.optional-dependencies]
context = ["transformers==4.57.6", "tokenizers==0.22.2", "huggingface-hub==0.36.2"]
dense = ["transformers==4.57.6", "torch==2.15.0", "tokenizers==0.22.2", "numpy==2.4.6", "safetensors==0.8.0", "huggingface-hub==0.36.2"]
bm25 = ["rank-bm25==0.2.2"]
chunking = ["tokenizers==0.22.2"]
benchmark = ["PyMuPDF==1.26.5"]
pdf = ["docling-slim==2.145.0", "docling-core==2.105.0", "docling-parse==7.24.2", "docling-ibm-models==4.0.4", "torch==2.15.0"]
dev = ["build>=1,<2", "mypy>=1,<2", "pytest>=8,<10", "ruff>=0.8,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["docling.*", "docling_core.*", "torch.*"]
ignore_missing_imports = true

name: debug-roster
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  dbg:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch==2.15.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,benchmark,bm25,dense]'
      - run: |
          python - <<'EOF'
          import os
          from huggingface_hub import hf_hub_download
          for n in ("config.json","merges.txt","tokenizer.json","tokenizer_config.json","vocab.json"):
              hf_hub_download("Qwen/Qwen3-8B", n, revision="b968826d9c46dd6066d109eabc6255188de91218", local_dir="/tmp/qwen")
          EOF
          rm -rf /tmp/qwen/.cache
      - run: BIORAG_QWEN_ROOT=/tmp/qwen python -m pytest -q -s tests/test_zz_debug.py -k test_dump | grep -E 'DEBUG|passed|failed'
      - run: python -m pip freeze | grep -iE '^(numpy|pydantic|rfc8785|rank|jinja|tokenizers|transformers|huggingface)'; python --version

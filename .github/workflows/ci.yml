name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Pinned to the platform of the locked renv library (linux-ubuntu-jammy): the primary R
    # result hash is byte-compared and has only been reproduced with that platform's numerics.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      # The Python/R handoff, rehearsal, result and supplement tests must run, not skip.
      BIORAG_REQUIRE_R: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          # Exact patch: split records embed sys.version, so test goldens depend on it.
          python-version: '3.11.15'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.1'
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          working-directory: analysis
      - name: renv library matches analysis/renv.lock
        working-directory: analysis
        run: Rscript -e 'st <- renv::status(); if (!isTRUE(st$synchronized)) quit(status = 1)'
      - name: Runner CPU and OpenBLAS kernel
        # Recorded so that a numerical difference can be tied to hardware. The pinned kernel is
        # set for the R testthat step and by the Python runner for every R subprocess.
        run: |
          lscpu | grep -E 'Model name|Flags' | sed -E 's/(Flags:).*(avx512f).*/\1 ... avx512f .../' | cut -c1-120
          OPENBLAS_VERBOSE=2 Rscript -e 'invisible(1)' 2>&1 | head -1
          OPENBLAS_VERBOSE=2 OPENBLAS_CORETYPE=HASWELL OPENBLAS_NUM_THREADS=1 Rscript -e 'invisible(1)' 2>&1 | head -1
      - run: python -m pip install 'torch==2.15.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,benchmark,bm25,dense]'
      - name: Pinned Qwen3-8B tokenizer files (no model weights)
        # The generation tests render and count tokens with this exact revision; the code
        # verifies every file against a pinned SHA-256 before use.
        run: |
          echo "BIORAG_QWEN_ROOT=$RUNNER_TEMP/qwen3-8b-tokenizer" >> "$GITHUB_ENV"
          BIORAG_QWEN_ROOT="$RUNNER_TEMP/qwen3-8b-tokenizer" python - <<'EOF'
          import os
          from huggingface_hub import hf_hub_download
          for name in ("config.json", "merges.txt", "tokenizer.json", "tokenizer_config.json", "vocab.json"):
              hf_hub_download(
                  "Qwen/Qwen3-8B",
                  name,
                  revision="b968826d9c46dd6066d109eabc6255188de91218",
                  local_dir=os.environ["BIORAG_QWEN_ROOT"],
              )
          EOF
          rm -rf "$RUNNER_TEMP/qwen3-8b-tokenizer/.cache"
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m pytest -q -rs
      - name: R testthat suite
        working-directory: analysis
        env:
          # The kernel run_analysis.R requires and tests/conftest.py sets; read when R starts.
          OPENBLAS_CORETYPE: HASWELL
          OPENBLAS_NUM_THREADS: '1'
        run: Rscript -e 'testthat::test_dir("tests/testthat", reporter = "summary", stop_on_failure = TRUE)'
      # Repository checks that need no study data. The statistical figures themselves need the
      # official result files and are not run here; the scripts are only syntax-checked.
      - name: Documentation links and citation metadata
        run: |
          python - <<'EOF'
          import os, re, sys
          bad = []
          for f in ("README.md", "docs/REPRODUCING.md", "docs/DATA_AND_LIMITATIONS.md", "figures/README.md"):
              text = open(f, encoding="utf-8").read()
              targets = re.findall(r"\]\(([^)]+)\)", text) + re.findall(r'src="([^"]+)"', text)
              for t in targets:
                  if t.startswith(("http://", "https://", "#")):
                      continue
                  path = t.split("#")[0]
                  if path and not os.path.exists(os.path.normpath(os.path.join(os.path.dirname(f), path))):
                      bad.append((f, t))
          print("broken links:", bad)
          sys.exit(1 if bad else 0)
          EOF
          python -m venv "$RUNNER_TEMP/cff"
          "$RUNNER_TEMP/cff/bin/python" -m pip install -q cffconvert
          "$RUNNER_TEMP/cff/bin/cffconvert" --validate -i CITATION.cff
      - name: Figure scripts parse and the wrapper is valid shell
        run: |
          Rscript -e 'for (f in list.files("figures/scripts", pattern = "[.]R$", full.names = TRUE)) invisible(parse(f))'
          bash -n figures/make_figures.sh

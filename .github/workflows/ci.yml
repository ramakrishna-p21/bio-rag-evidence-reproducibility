name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install 'torch==2.15.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,benchmark,bm25,dense]'
      - run: python -m pytest -q
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy src/biorag_repro
      - run: python scripts/export_schemas.py --check
      - run: python -m build
